# Tiene sveglio il database gratuito di Supabase (va in pausa dopo 7 giorni senza visite).
# URL e chiave sono gli stessi di config.js: pubblici per natura, quindi niente secret.
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: >-
          curl -fsS "https://lykqnafklqntiyivxcnp.supabase.co/rest/v1/dinners?select=id&limit=1"
          -H "apikey: sb_publishable_rMO0K7cEOUdFVlEMvUQ7bA_woOT4egX" > /dev/null
      - name: Tieni acceso questo cron (GitHub lo spegne dopo 60 giorni senza commit)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
