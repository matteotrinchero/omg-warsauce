<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMG Warsauce</title>
<meta name="description" content="Osteria Matteo &amp; Giovanni. Made in Italy. Cooked in Warsaw.">
<meta name="theme-color" content="#F6F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OMG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* App shell: una colonna larga come un telefono, cinque tab in basso, bottom sheet per le azioni.
   Fondo chiaro, testo scuro, accenti tricolore. Font di sistema (SF Pro su iPhone, Roboto su Android). */
:root{
  --bg:#F6F6F3; --card:#FFFFFF; --ink:#121417; --ink-2:#5C636D; --ink-3:#8B919A;
  --line:#E7E5E0; --fill:#EFEEEA; --frame:#E9E8E3;
  --green:#008C45; --green-2:#00733A; --green-soft:#E5F3EA;
  --red:#CD212A; --red-2:#A8161E; --red-soft:#FBE8E9;
  --gold:#B8912C; --silver:#8E949C; --bronze:#A8693A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tab:64px; --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--frame)}
body{margin:0;background:var(--frame);font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid rgba(0,140,69,.45);outline-offset:2px;border-radius:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}

.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}
@media (min-width:560px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(18,20,23,.35)}}
.screen{padding-top:10px;padding-bottom:calc(var(--tab) + 32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px;align-content:start}

/* testata */
.flag{display:inline-flex;height:4px;width:36px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1;background:var(--green)} .flag i:nth-child(2){background:#fff} .flag i:nth-child(3){background:var(--red)}
.eb{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:0}
.lt{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.brand{display:grid;gap:10px;padding-top:6px}
.wordmark{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:.92;margin:0}
.wordmark span{color:var(--green)} .wordmark em{font-style:normal;color:var(--red)}
.tag{margin:0;color:var(--ink-2);font-size:15px}
.tag b{color:var(--ink);font-weight:700}
.demo{justify-self:start;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--fill);padding:5px 10px;border-radius:999px}

/* card prossima cena */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(18,20,23,.04),0 10px 30px -18px rgba(18,20,23,.22);overflow:hidden}
.next-img{position:relative;aspect-ratio:4/3;max-width:100%}
.next-img img{width:100%;height:100%;object-fit:cover}
.next-over{position:absolute;inset:auto 0 0 0;padding:56px 18px 16px;background:linear-gradient(to top,rgba(10,12,14,.78),rgba(10,12,14,0));color:#fff;display:grid;gap:4px}
.next-over h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.next-over p{margin:0;font-size:15px;opacity:.92}
.pill-light{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.92);color:var(--ink);padding:4px 9px;border-radius:999px}
.next-b{padding:16px;display:grid;gap:14px}
.seats{display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
.seats b{color:var(--ink)}
.bar{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--green) 60%,var(--red))}
.stack{display:flex;align-items:center}
.stack .av{margin-left:-10px;box-shadow:0 0 0 2.5px var(--card)} .stack .av:first-child{margin-left:0}
.stack .more{margin-left:8px;font-size:13px;color:var(--ink-2);font-weight:600}

/* bottoni */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;font-size:16px;font-weight:700;padding:0 18px;text-decoration:none;transition:transform .12s, opacity .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);color:#fff}
.btn.ok{background:var(--green-soft);color:var(--green-2)}
.btn.soft{background:var(--fill);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red-2)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.link{background:none;border:0;color:var(--green-2);font-weight:600;padding:6px 0;font-size:15px}

/* sezioni */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh h3 small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:6px;letter-spacing:0}
.sh .side{font-size:14px;color:var(--ink-3)}
.group{display:grid;gap:12px}

/* chi viene */
.faces{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.faces::-webkit-scrollbar{display:none}
.face{flex:none;width:68px;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;text-align:center}
.face .nm{font-size:13px;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face .ds{font-size:11px;color:var(--ink-3);max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-3px}
.empty{background:var(--card);border-radius:16px;padding:18px;color:var(--ink-2);font-size:15px;text-align:center;border:1px dashed var(--line)}

.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;flex:none;font-weight:700;letter-spacing:-.02em;background:var(--fill)}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--green) 0 33.3%,#fff 0 66.6%,var(--red) 0);display:inline-grid}
.ring .av{box-shadow:0 0 0 3px var(--card)}

/* numeri */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 12px;display:grid;gap:2px;min-width:0}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font-size:12px;color:var(--ink-3);font-weight:600}
.tile.text b{font-size:15px;line-height:1.25;white-space:normal}

.hosts{display:flex;align-items:center;gap:14px;padding:16px}
.hosts p{margin:0;font-size:14px;color:var(--ink-2)}
.hosts p b{display:block;color:var(--ink);font-size:16px}

/* menu */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(18,20,23,.12)}
.mh{display:flex;align-items:baseline;gap:8px;margin:6px 0 0}
.mh b{font-size:24px;font-weight:900;letter-spacing:.02em}
.mh small{font-size:14px;font-weight:600;font-style:italic}
.mh.main small{color:var(--green-2)} .mh.side small{color:var(--red)}
.dish{display:grid}
.dish-img{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--fill)}
.dish-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.dish-b{padding:12px 14px 14px;display:grid;gap:4px}
.dish-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dish-t h4{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;min-width:0}
.cnt{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.dish-b p{margin:0;color:var(--ink-2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--ink-2)}
.chip.g{background:var(--green-soft);color:var(--green-2)} .chip.r{background:var(--red-soft);color:var(--red-2)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sides .dish-img{aspect-ratio:1/1}
.sides .dish-b{padding:10px 12px 12px}
.sides .dish-t h4{font-size:15px}
.drinks{display:grid}
.drink{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:16px}
.drink:first-child{border-top:0}
.drink span{color:var(--ink-3);font-size:13px;font-style:italic}

/* famiglia */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;padding:18px 12px 16px}
.pod{display:grid;justify-items:center;gap:6px;text-align:center;background:none;border:0;padding:0;min-width:0}
.pod .nm{font-size:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .ct{font-size:12px;color:var(--ink-3);font-weight:600}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;margin-top:-16px;position:relative;box-shadow:0 0 0 2px var(--card)}
.fam{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.mem{display:grid;justify-items:center;gap:5px;background:none;border:0;padding:0;text-align:center;min-width:0}
.mem .nm{font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .ct{font-size:12px;color:var(--ink-3);margin-top:-3px}
.host{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red);}

/* archivio */
.arch{display:grid;gap:12px}
.ad{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--card);border:0;border-radius:18px;text-align:left;width:100%;box-shadow:0 1px 2px rgba(18,20,23,.04)}
.ad img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.ad .t{display:block;font-size:16px;font-weight:700}
.ad .m{display:block;margin:2px 0 6px;font-size:13px;color:var(--ink-2)}
.ad>span{min-width:0}
.ad .stack .av{box-shadow:0 0 0 2px var(--card);margin-left:-6px}
.ad .stack .av:first-child{margin-left:0}
.chev{color:var(--ink-3);font-size:22px;line-height:1}

/* profilo */
.back{justify-self:start;display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--green-2);font-size:17px;font-weight:500;padding:4px 0}
.prof{display:grid;justify-items:center;text-align:center;gap:6px;padding-top:6px}
.prof h2{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.prof .ig{color:var(--green-2);font-weight:600;text-decoration:none;font-size:15px}
.prof .bio{margin:4px 0 0;color:var(--ink-2);font-size:15px;max-width:34ch}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:12px;font-weight:700;max-width:100%}
.stamp.on{border:2px solid var(--green);background:var(--green-soft);color:var(--green-2)}
.stamp.on:nth-child(3n+2){border-color:var(--red);background:var(--red-soft);color:var(--red-2)}
.lvl{padding:0 16px 14px;font-size:13px;color:var(--ink-2)}
.hist{display:grid}
.hi{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.hi:first-child{border-top:0}
.hi img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.hi b{font-size:15px;display:block}
.hi em{font-style:normal;font-weight:500;color:var(--ink-3)}
.hi small{display:block;font-size:13px;color:var(--ink-2)}
.join{padding:22px 18px;display:grid;gap:12px;text-align:center;justify-items:center}
.join h3{margin:0;font-size:22px;font-weight:800}
.join p{margin:0;color:var(--ink-2);font-size:15px}
.fine{font-size:12px;color:var(--ink-3);text-align:center;margin:0;display:grid;gap:4px}
.fine b{color:var(--ink-2)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs a{height:var(--tab);display:grid;justify-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:600}
.tabs a svg{width:25px;height:25px}
.tabs a[aria-current="page"]{color:var(--green)}
.tabs .tav{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid}
.tabs a[aria-current="page"] .tav{box-shadow:0 0 0 2px var(--green)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(18,20,23,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:#D6D4CE;margin:0 auto 10px}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sh-top h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--ink-2);font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.in{width:100%;border:0;background:var(--card);border-radius:12px;padding:13px 14px;font-size:16px;box-shadow:inset 0 0 0 1px var(--line)}
.in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--green)}
textarea.in{resize:vertical;min-height:84px}
.igin{display:flex;align-items:center;background:var(--card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.igin span{padding-left:14px;color:var(--ink-3);font-weight:600}
.igin .in{box-shadow:none;background:transparent;padding-left:4px}
.igin:focus-within{box-shadow:inset 0 0 0 2px var(--green)}
.pick{display:grid;justify-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--green-2)}
.pick .pp{width:104px;height:104px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;overflow:hidden;color:var(--ink-3)}
.pick .pp img{width:100%;height:100%;object-fit:cover}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--ink-2)}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--green)}
.err{margin:0;color:var(--red-2);font-weight:600;font-size:14px}
.opts{display:grid;gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .o{display:grid;grid-template-columns:52px 1fr 22px;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px 12px 8px 8px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.opt .o img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.opt .o b{display:block;font-size:15px}
.opt .o small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .o span{min-width:0}
.opt .tick{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:#fff;font-size:13px}
.opt input:checked + .o{box-shadow:inset 0 0 0 2px var(--green)}
.opt input:checked + .o .tick{background:var(--green);box-shadow:none}
.opt input:focus-visible + .o{outline:3px solid rgba(0,140,69,.45);outline-offset:2px}
.opt.noimg .o{grid-template-columns:1fr 22px;padding:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pl{position:relative}
.pl input{position:absolute;opacity:0;width:1px;height:1px}
.pl span{display:inline-block;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;cursor:pointer}
.pl input:checked + span{background:var(--green);color:#fff;box-shadow:none}
.pl input:focus-visible + span{outline:3px solid rgba(0,140,69,.45);outline-offset:2px}

/* biglietto */
.ticket{position:relative;background:var(--card);border-radius:18px;padding:20px 18px;display:grid;gap:10px;box-shadow:0 10px 30px -18px rgba(18,20,23,.3);
  -webkit-mask:radial-gradient(circle 11px at 0 108px,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 108px,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 108px,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 108px,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .tk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:76px}
.ticket .tk-h b{font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1}
.ticket .tk-h b span{color:var(--green)} .ticket .tk-h b em{font-style:normal;color:var(--red)}
.ticket .tk-h small{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.dop{transform:rotate(-9deg);border:2px solid var(--red);color:var(--red);border-radius:8px;padding:4px 8px;text-align:center;font-weight:900;font-size:16px;line-height:1;flex:none}
.dop small{display:block;font-size:7.5px;font-weight:700;letter-spacing:.04em;margin-top:3px;color:var(--red)}
.cut{border-top:2px dashed var(--line);margin:4px -18px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.row span{color:var(--ink-3)}
.row b{text-align:right;min-width:0;overflow-wrap:anywhere;font-weight:600}
.ticket .no{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.12em;margin-top:4px}

/* foto */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:16px;overflow:hidden}
.gal button{padding:0;border:0;background:var(--fill);aspect-ratio:1/1;position:relative;display:block;max-width:100%}
.gal img{width:100%;height:100%;object-fit:cover}
.pend{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;background:rgba(255,255,255,.94);color:var(--ink-2);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.full{width:100%;border-radius:16px;background:var(--fill)}
.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shot{flex:none;width:132px;height:132px;border-radius:16px;overflow:hidden;border:0;padding:0;background:var(--fill)}
.shot img{width:100%;height:100%;object-fit:cover}
.mod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden;min-width:0}
.mod img{width:100%;aspect-ratio:1/1;object-fit:cover}
.mod figcaption{padding:8px;display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.mod .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* admin */
.list{display:grid}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{font-size:15px;display:block}
.li small{font-size:12px;color:var(--ink-3);display:block}
.li .acts{display:flex;gap:6px;align-items:center}
.mini{border:0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;background:var(--fill);color:var(--ink-2)}
.mini.on{background:var(--green-soft);color:var(--green-2)}
.mini.del{background:var(--red-soft);color:var(--red-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shop{display:grid;gap:4px;padding:14px 16px;font-size:15px}
.shop .row b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-3);margin:0}
.tip{font-size:13px;line-height:1.4;color:var(--green-2);background:var(--green-soft);border-radius:12px;padding:10px 12px;margin:0}
.tip.warn{color:var(--red-2);background:var(--red-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.loading{padding:80px 16px;text-align:center;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var CFG = window.OMG_CONFIG || {};
var LIVE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
var UA = navigator.userAgent || "";
var INAPP = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|TikTok|musical_ly|Bytedance|Snapchat|LinkedInApp|Line\//i.test(UA);
var IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function standalone(){ try { return navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches; } catch(e){ return false; } }
function joinTip(){
  if (INAPP) return '<p class="tip warn">Open this page in Safari or Chrome first (tap ••• > Open in browser). Your profile stays in the browser you sign up from.</p>';
  if (IOS && !standalone()) return '<p class="tip">Tip: first tap Share > Add to Home Screen, then sign up from the OMG icon. Your profile stays where you sign up.</p>';
  return "";
}

/* ---------- Carta ---------- */
var DISHES = [
  {id:"carbonara", sec:"main", kind:"pasta", name:"Carbonara", desc:"Guanciale, egg yolks, pecorino, black pepper. No cream. Ever.", tags:[["Roma",""]]},
  {id:"amatriciana", sec:"main", kind:"pasta", name:"Amatriciana", desc:"Guanciale, tomato, pecorino. The Roman classic.", tags:[["Roma",""]]},
  {id:"ragu", sec:"main", kind:"pasta", name:"Pasta al ragù", desc:"Slow-cooked bolognese ragù, parmigiano on top.", tags:[["Bologna",""]]},
  {id:"tortellini", sec:"main", kind:"pasta", name:"Tortellini", desc:"Bologna's little treasures. Sauce of the night.", tags:[["Bologna",""]]},
  {id:"aglio-olio", sec:"main", kind:"pasta", name:"Aglio, olio e peperoncino", desc:"Garlic, olive oil, chili. The midnight pasta.", tags:[["Vegan","g"],["Spicy",""]]},
  {id:"bruschette", sec:"main", kind:"other", name:"Bruschette", desc:"Grilled bread, fresh tomatoes, basil, good olive oil.", tags:[["Vegan","g"]]},
  {id:"pizza", sec:"main", kind:"pinsa", name:"Pizza", desc:"Pinsa base, topped by the chefs. Ask what's on tonight.", tags:[["Pinsa","r"]]},
  {id:"patate", sec:"side", name:"Patate al forno", desc:"Roast potatoes, rosemary, crispy edges.", tags:[]},
  {id:"verdure", sec:"side", name:"Verdure grigliate", desc:"Zucchini, eggplant, peppers, olive oil.", tags:[]},
  {id:"contorno", sec:"side", name:"Contorno del giorno", desc:"The side of the day. The chefs decide.", tags:[]}
];
var DRINKS = [
  {id:"rosso", name:"Vino rosso"}, {id:"bianco", name:"Vino bianco"}, {id:"spritz", name:"Aperol Spritz"},
  {id:"negroni", name:"Negroni"}, {id:"birra", name:"Birra"}, {id:"limoncello", name:"Limoncello", note:"extra life"},
  {id:"zero", name:"Analcolico", note:"water, juice, dignity"}
];
var LEVELS = [
  {min:0, name:"New in town"}, {min:1, name:"Ospite"}, {min:3, name:"Amico della casa"},
  {min:5, name:"Nonno della carbonara"}, {min:10, name:"Cittadino onorario"}
];
var KIND = {pasta:"Pasta night", pizza:"Pizza night", mixed:"Pasta & pizza night"};
var D = {}; DISHES.forEach(function(d){ D[d.id]=d; });
var DR = {}; DRINKS.forEach(function(d){ DR[d.id]=d; });
function img(id){ return "img/" + id + ".jpg"; }

/* ---------- Utility ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(iso, o){ if(!iso) return "Date TBA"; try { return new Intl.DateTimeFormat("en-GB", o).format(new Date(iso)); } catch(e){ return String(iso); } }
function fDay(iso){ return fmt(iso, {weekday:"short", day:"numeric", month:"short"}); }
function fTime(iso){ return iso ? fmt(iso, {hour:"2-digit", minute:"2-digit"}) : ""; }
function when(d){ return d.starts_at ? fDay(d.starts_at) + " · " + fTime(d.starts_at) : "Date TBA"; }
function plural(n, a, b){ return n + " " + (n === 1 ? a : b); }
function tnum(id){ var h = 7; String(id).split("").forEach(function(c){ h = (h*31 + c.charCodeAt(0)) % 9000; }); return String(1000 + h); }

var S = {guests:[], dinners:[], bookings:[], photos:[], meId:null, isAdmin:false, email:null, menu:"tonight", screen:"home", gid:null, last:"home", ready:false};

function guest(id){ for (var i=0;i<S.guests.length;i++) if (S.guests[i].id === id) return S.guests[i]; return null; }
function upcoming(){ return S.dinners.filter(function(d){ return d.status !== "done"; }).sort(function(a,b){ return a.number - b.number; })[0] || null; }
function past(){ return S.dinners.filter(function(d){ return d.status === "done"; }).sort(function(a,b){ return b.number - a.number; }); }
function doneSet(){ var s = {}; past().forEach(function(d){ s[d.id] = d; }); return s; }
function bOf(did){ return S.bookings.filter(function(b){ return b.dinner_id === did; }); }
function taken(d, except){ return bOf(d.id).filter(function(b){ return b.id !== except; }).reduce(function(n,b){ return n + 1 + (b.plus||0); }, 0); }
function mine(){ var n = upcoming(); if (!n || !S.meId) return null; return bOf(n.id).filter(function(b){ return b.guest_id === S.meId; })[0] || null; }
function attended(gid){ var ds = doneSet(); return S.bookings.filter(function(b){ return b.guest_id === gid && ds[b.dinner_id] && b.attended !== false; }); }
function level(n){ var l = LEVELS[0]; LEVELS.forEach(function(x){ if (n >= x.min) l = x; }); return l; }
function fav(gid){ var c = {}; attended(gid).forEach(function(b){ if (b.main) c[b.main] = (c[b.main]||0) + 1; }); var top = Object.keys(c).sort(function(a,b){ return c[b]-c[a]; })[0]; return top ? D[top] : null; }
function orders(id){ var ds = doneSet(); return S.bookings.filter(function(b){ return ds[b.dinner_id] && b.attended !== false && (b.main === id || b.side === id); }).reduce(function(n,b){ return n + 1 + (b.plus||0); }, 0); }
function dinnerDishes(n, sec){ var list = (n && n.dishes && n.dishes.length) ? n.dishes : DISHES.map(function(d){ return d.id; }); return list.map(function(id){ return D[id]; }).filter(function(d){ return d && d.sec === sec; }); }
function dinnerImg(d){ return d && d.kind === "pizza" ? "img/pizza.jpg" : "img/hero.jpg"; }
function topDish(d){ var c = {}; bOf(d.id).forEach(function(b){ if (b.attended !== false && b.main) c[b.main] = (c[b.main]||0) + 1 + (b.plus||0); }); var t = Object.keys(c).sort(function(a,b){ return c[b]-c[a]; })[0]; return t ? D[t] : null; }

function approvedOf(did){ return S.photos.filter(function(p){ return p.dinner_id === did && p.status === "approved"; }); }
var TINTS = [["#E5F3EA","#00733A"],["#FBE8E9","#A8161E"],["#ECEEF1","#3A4250"]];
function av(g, size, cls){
  size = size || 48; if (!g) return "";
  var s = "width:" + size + "px;height:" + size + "px";
  if (g.photo_url) return '<img class="av ' + (cls||"") + '" style="' + s + '" src="' + esc(g.photo_url) + '" alt="' + esc(g.name) + '" loading="lazy">';
  var ini = String(g.name || "?").trim().split(/\s+/).map(function(w){ return w.charAt(0); }).slice(0,2).join("").toUpperCase();
  var h = 0; String(g.id).split("").forEach(function(c){ h = (h*31 + c.charCodeAt(0)) >>> 0; });
  var t = TINTS[h % 3];
  return '<span class="av ' + (cls||"") + '" style="' + s + ';background:' + t[0] + ';color:' + t[1] + ';font-size:' + Math.round(size*0.38) + 'px" role="img" aria-label="' + esc(g.name) + '">' + esc(ini) + '</span>';
}
function stack(list, size, max){
  max = max || 6;
  var shown = list.slice(0, max).map(function(g){ return av(g, size); }).join("");
  var more = list.length > max ? '<span class="more">+' + (list.length - max) + '</span>' : "";
  return '<span class="stack">' + shown + more + '</span>';
}
function cleanIg(v){ v = String(v||"").trim().replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/[/?#].*$/, ""); return /^[A-Za-z0-9._]{1,30}$/.test(v) ? v : ""; }
function brandHTML(){ return '<b><span>OMG</span> WARSAUCE</b>'; }

/* ---------- Render ---------- */
function render(){
  if (!S.ready) return;
  $$(".screen").forEach(function(el){ el.hidden = el.dataset.screen !== S.screen; });
  var tab = S.screen === "guest" ? "famiglia" : S.screen;
  $$(".tabs a").forEach(function(a){ if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  var me = guest(S.meId);
  $("#tab-av").innerHTML = me ? av(me, 26) : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="width:26px;height:26px"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6.2 18.3c1.3-2.2 3.3-3.4 5.8-3.4s4.5 1.2 5.8 3.4"/></svg>';
  if (S.screen === "home") rHome();
  if (S.screen === "menu") rMenu();
  if (S.screen === "famiglia") rFam();
  if (S.screen === "archivio") rArch();
  if (S.screen === "me") rMe();
  if (S.screen === "guest") rGuest();
}

function ctaHTML(){
  var n = upcoming(), b = mine();
  if (!n) return '<button class="btn soft" disabled>Next dinner coming soon</button>';
  if (b) return '<button class="btn ok" data-act="ticket">You\'re in · See your ticket</button>';
  if (n.status === "closed") return '<button class="btn soft" disabled>Bookings closed</button>';
  if (!S.meId) return '<button class="btn primary" data-act="join-book">Join La Famiglia to book</button>';
  if (taken(n) >= (n.seats||20)) return '<button class="btn soft" disabled>Sold out</button>';
  return '<button class="btn primary" data-act="book">Prenota · Book your seat</button>';
}

function rHome(){
  var n = upcoming(), all = n ? bOf(n.id) : [];
  var coming = all.map(function(b){ return {b:b, g:guest(b.guest_id)}; }).filter(function(x){ return x.g; });
  var hosts = S.guests.filter(function(g){ return g.is_host; });
  var ds = doneSet();
  var doneB = S.bookings.filter(function(b){ return ds[b.dinner_id] && b.attended !== false; });
  var kg = doneB.reduce(function(s,b){ return s + (D[b.main] && D[b.main].kind === "pasta" ? (1 + (b.plus||0)) * 0.11 : 0); }, 0);
  var h = '';
  h += '<header class="brand">';
  if (!LIVE) h += '<span class="demo">Demo preview · example data</span>';
  h += '<span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>';
  h += '<h1 class="wordmark"><span>OMG</span><br>WARSAUCE</h1>';
  h += '<p class="tag"><b>Osteria Matteo &amp; Giovanni</b><br>Made in Italy. Cooked in Warsaw.</p></header>';
  if (n) {
    var t = taken(n), seats = n.seats || 20, pct = Math.min(100, Math.round(t / seats * 100));
    h += '<article class="card"><div class="next-img"><img src="' + dinnerImg(n) + '" alt="' + esc(KIND[n.kind] || "Dinner") + '"><div class="next-over">';
    h += '<span class="pill-light">Cena n. ' + esc(n.number) + '</span><h2>' + esc(KIND[n.kind] || "Dinner") + '</h2><p>' + esc(when(n)) + '</p></div></div>';
    h += '<div class="next-b"><div class="seats"><div class="bar"><i style="width:' + pct + '%"></i></div><span><b>' + t + '</b> of ' + seats + ' seats taken' + (seats - t > 0 && seats - t <= 5 ? ' · <b style="color:var(--red)">only ' + (seats - t) + ' left</b>' : '') + '</span></div>';
    if (coming.length) h += stack(coming.map(function(x){ return x.g; }), 34, 7);
    h += ctaHTML() + '</div></article>';
  } else {
    h += '<article class="card"><div class="next-img"><img src="img/hero.jpg" alt="A table full of Italian dishes"></div><div class="next-b"><p style="margin:0;color:var(--ink-2)">The next dinner is being cooked up. Check back soon.</p>' + ctaHTML() + '</div></article>';
  }
  h += '<div class="group"><div class="sh"><h3>Stasera<small>Who\'s coming</small></h3><span class="side">' + (n ? plural(t || 0, "seat", "seats") : "") + '</span></div>';
  if (coming.length) {
    h += '<div class="faces">' + coming.map(function(x){
      var d = D[x.b.main];
      return '<button class="face" data-act="guest" data-id="' + esc(x.g.id) + '">' + av(x.g, 62) + '<span class="nm">' + esc(x.g.name.split(" ")[0]) + (x.b.plus ? ' +' + x.b.plus : '') + '</span><span class="ds">' + esc(d ? d.name : "") + '</span></button>';
    }).join("") + '</div>';
  } else h += '<div class="empty">' + (n ? "Nobody yet. Be the first at the table." : "No dinner open right now.") + '</div>';
  h += '</div>';
  var lastPh = S.photos.filter(function(p){ return p.status === "approved"; }).sort(function(a,b){ return String(b.created_at).localeCompare(String(a.created_at)); }).slice(0, 12);
  if (lastPh.length) h += '<div class="group"><div class="sh"><h3>Dall\'archivio<small>Latest photos</small></h3><a class="side" href="#archivio" style="color:var(--green-2);text-decoration:none;font-weight:600">All</a></div><div class="shots">' + lastPh.map(function(p){ return '<button class="shot" data-act="photo" data-id="' + esc(p.id) + '"><img src="' + esc(p.url) + '" alt="Photo from a dinner" loading="lazy"></button>'; }).join("") + '</div></div>';
  h += '<div class="tiles"><div class="tile"><b>' + past().length + '</b><span>Cene</span></div><div class="tile"><b>' + S.guests.length + '</b><span>Famiglia</span></div><div class="tile"><b>' + kg.toFixed(1) + '</b><span>Kg di pasta</span></div></div>';
  h += '<div class="card hosts">' + (hosts.length ? stack(hosts, 48, 2) : '') + '<p><b>Your hosts: OMG</b>Osteria Matteo &amp; Giovanni. Also what you\'ll say after the first bite.</p></div>';
  $("#s-home").innerHTML = h;
}

function dishCard(d, badge, small){
  var c = orders(d.id);
  return '<article class="card dish"><div class="dish-img"><img src="' + img(d.id) + '" alt="' + esc(d.name) + '" loading="lazy">' + (badge ? '<span class="badge">Tonight</span>' : '') + '</div>' +
    '<div class="dish-b"><div class="dish-t"><h4>' + esc(d.name) + '</h4>' + (c ? '<span class="cnt">' + c + '× served</span>' : '') + '</div>' +
    (small ? '' : '<p>' + esc(d.desc) + '</p>' + (d.tags.length ? '<div class="chips">' + d.tags.map(function(t){ return '<span class="chip ' + t[1] + '">' + esc(t[0]) + '</span>'; }).join("") + '</div>' : '')) +
    (small ? '<p style="font-size:13px">' + esc(d.desc) + '</p>' : '') + '</div></article>';
}
function rMenu(){
  var n = upcoming(), tonight = S.menu === "tonight";
  var mains = tonight ? (n ? dinnerDishes(n, "main") : []) : DISHES.filter(function(d){ return d.sec === "main"; });
  var sides = tonight ? (n ? dinnerDishes(n, "side") : []) : DISHES.filter(function(d){ return d.sec === "side"; });
  var avail = {}; if (n) dinnerDishes(n, "main").concat(dinnerDishes(n, "side")).forEach(function(d){ avail[d.id] = 1; });
  var h = '<header><p class="eb">' + (n ? 'Cena n. ' + esc(n.number) + ' · ' + esc(KIND[n.kind] || "") : 'La carta') + '</p><h1 class="lt">Il Menu</h1></header>';
  h += '<div class="seg" role="tablist"><button role="tab" data-act="menu-mode" data-mode="tonight" aria-selected="' + tonight + '">Tonight</button><button role="tab" data-act="menu-mode" data-mode="all" aria-selected="' + (!tonight) + '">Full menu</button></div>';
  if (tonight && !n) { h += '<div class="empty">No dinner open right now. Have a look at the full menu.</div>'; $("#s-menu").innerHTML = h; return; }
  h += '<div class="group"><h2 class="mh main"><b>MAIN</b><small>characters</small></h2>' + mains.map(function(d){ return dishCard(d, !tonight && avail[d.id]); }).join("") + '</div>';
  if (sides.length) h += '<div class="group"><h2 class="mh side"><b>SIDE</b><small>quests</small></h2><div class="sides">' + sides.map(function(d){ return dishCard(d, !tonight && avail[d.id], true); }).join("") + '</div></div>';
  h += '<div class="group"><h2 class="mh"><b>DRINKS</b></h2><div class="card drinks">' + DRINKS.map(function(d){ return '<div class="drink"><b style="font-weight:600">' + esc(d.name) + '</b>' + (d.note ? '<span>' + esc(d.note) + '</span>' : '') + '</div>'; }).join("") + '</div></div>';
  $("#s-menu").innerHTML = h;
}

function ranked(){
  return S.guests.map(function(g){ return {g:g, n:attended(g.id).length}; }).sort(function(a,b){ return b.n - a.n || String(a.g.name).localeCompare(String(b.g.name)); });
}
function rFam(){
  var r = ranked(), top = r.filter(function(x){ return x.n > 0; }).slice(0,3);

/* ---------- Join / edit ---------- */
function photoBlob(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 480;
      c.getContext("2d").drawImage(im, (im.width - s)/2, (im.height - s)/2, s, s, 0, 0, 480, 480);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error("Could not read the photo.")); }, "image/jpeg", 0.85);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("This file is not a photo we can read.")); };
    im.src = url;
  });
}

function canUpload(d){ if (!S.meId) return false; if (S.isAdmin) return true; return bOf(d.id).some(function(b){ return b.guest_id === S.meId; }); }
function resizeImg(file, max, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error("Could not read a photo.")); }, "image/jpeg", q);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("One of the files is not a photo.")); };
    im.src = url;
  });
}

/* ---------- Dati: Supabase (versione live) ---------- */
var sb = null;
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("Could not load " + src)); }; document.head.appendChild(s); }); }
function chk(r){ if (r && r.error) throw r.error; return r; }
var Live = {
  init: function(){
    var self = this;
    return loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js").then(function(){
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{flowType:"pkce", persistSession:true, detectSessionInUrl:true}});
      return self.reload();
    }).then(function(){
      var re = function(){ self.reload().then(render).catch(function(){}); };
      sb.channel("omg").on("postgres_changes", {event:"*", schema:"public", table:"bookings"}, re).on("postgres_changes", {event:"*", schema:"public", table:"guests"}, re).on("postgres_changes", {event:"*", schema:"public", table:"dinners"}, re).on("postgres_changes", {event:"*", schema:"public", table:"photos"}, re).subscribe();
      sb.auth.onAuthStateChange(function(){ setTimeout(re, 0); });
      document.addEventListener("visibilitychange", function(){ if (!document.hidden) re(); });
    });
  },
  reload: function(){
    return Promise.all([sb.auth.getSession(), sb.from("guests").select("*"), sb.from("dinners").select("*"), sb.from("bookings").select("*"), sb.from("photos").select("*")]).then(function(r){
      chk(r[1]); chk(r[2]); chk(r[3]); chk(r[4]);
      var session = r[0].data.session, uid = session ? session.user.id : null;
      S.guests = r[1].data; S.dinners = r[2].data; S.bookings = r[3].data; S.photos = r[4].data;
      S.meId = uid && S.guests.some(function(g){ return g.id === uid; }) ? uid : null;
      S.email = session && session.user.email ? session.user.email : null;
      if (!S.email) { S.isAdmin = false; return; }
      return sb.rpc("is_admin").then(function(x){ S.isAdmin = !!(x && x.data); });
    });
  },
  uid: function(){ return sb.auth.getSession().then(function(r){ if (r.data.session) return r.data.session.user.id; return sb.auth.signInAnonymously().then(function(x){ chk(x); return x.data.user.id; }); }); },
  join: function(p, blob){
    var self = this;
    return this.uid().then(function(uid){
      var row = {id:uid, name:p.name, instagram:p.instagram, bio:p.bio};
      var up = blob ? sb.storage.from("avatars").upload(uid + "/avatar-" + Date.now() + ".jpg", blob, {contentType:"image/jpeg", upsert:true}).then(function(x){ chk(x); row.photo_url = sb.storage.from("avatars").getPublicUrl(x.data.path).data.publicUrl; }) : Promise.resolve();
      return up.then(function(){ return sb.from("guests").upsert(row); }).then(chk);
    }).then(function(){ return self.reload(); });
  },
  book: function(n, c){ var self = this, row = {dinner_id:n.id, guest_id:S.meId}; for (var k in c) row[k] = c[k]; return sb.from("bookings").upsert(row, {onConflict:"dinner_id,guest_id"}).then(chk).then(function(){ return self.reload(); }); },
  cancel: function(b){ var self = this; return sb.from("bookings").delete().eq("id", b.id).then(chk).then(function(){ return self.reload(); }); },
  delBooking: function(b){ return this.cancel(b); },
  saveDinner: function(d){ var self = this, row = {number:d.number, starts_at:d.starts_at, kind:d.kind, seats:d.seats, dishes:d.dishes, status:d.status}; return (d.id ? sb.from("dinners").update(row).eq("id", d.id) : sb.from("dinners").insert(row)).then(chk).then(function(){ return self.reload(); }); },
  setAttended: function(b, v){ var self = this; return sb.from("bookings").update({attended:v}).eq("id", b.id).then(chk).then(function(){ return self.reload(); }); },
  setHost: function(g, v){ var self = this; return sb.from("guests").update({is_host:v}).eq("id", g.id).then(chk).then(function(){ return self.reload(); }); },
  delGuest: function(g){ var self = this; return sb.from("guests").delete().eq("id", g.id).then(chk).then(function(){ return self.reload(); }); },
  uploadPhotos: function(d, blobs){
    var self = this, uid = S.meId;
    return blobs.reduce(function(p, b, i){ return p.then(function(){
      var path = uid + "/" + d.id + "/" + Date.now() + "-" + i + ".jpg";
      return sb.storage.from("dinner-photos").upload(path, b, {contentType:"image/jpeg"}).then(function(x){
        chk(x); var url = sb.storage.from("dinner-photos").getPublicUrl(x.data.path).data.publicUrl;
        return sb.from("photos").insert({dinner_id:d.id, guest_id:uid, url:url, path:x.data.path}).then(chk);
      });
    }); }, Promise.resolve()).then(function(){ return self.reload(); });
  },
  setPhoto: function(p, st){ var self = this; return sb.from("photos").update({status:st}).eq("id", p.id).then(chk).then(function(){ return self.reload(); }); },
  delPhoto: function(p){ var self = this; return sb.from("photos").delete().eq("id", p.id).then(chk).then(function(){ return p.path ? sb.storage.from("dinner-photos").remove([p.path]) : null; }).then(function(){ return self.reload(); }); },
  login: function(email, pw){ var self = this; return sb.auth.signInWithPassword({email:email, password:pw}).then(chk).then(function(){ return self.reload(); }); },
  logout: function(){ var self = this; return sb.auth.signOut().then(function(){ return self.reload(); }); },
  resetDemo: function(){ return Promise.resolve(); }
};

var api = LIVE ? Live : Demo;
api.init().then(function(){ S.ready = true; route(); })
  .catch(function(e){ S.ready = true; $("#s-home").innerHTML = '<div class="empty" style="margin-top:40px">Could not load the app. ' + esc(niceErr(e)) + '</div>'; });
})();
</script>
</body>
</html>
